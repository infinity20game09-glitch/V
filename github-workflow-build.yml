name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Modèles vocaux hors ligne (FR + EN)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o fr.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          curl -fL -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q fr.zip && mv vosk-model-small-fr-0.22 app/src/main/assets/model-fr
          unzip -q en.zip && mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: V-apk
          path: app/build/outputs/apk/debug/app-debug.apk
